<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Sesomu AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300e5ff'/%3E%3Cstop offset='1' stop-color='%238a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 4l24 14v28L32 60 8 46V18z' fill='%2307091a' stroke='url(%23g)' stroke-width='4'/%3E%3Cpath d='M41 24c-2-3-5-4-9-4-5 0-8 2.5-8 6 0 9 18 4 18 13 0 4-4 6-9 6-4 0-7-1.5-9-4' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#05060f; --text:#e9ecff; --muted:#8a90b8;
    --cyan:#00e5ff; --violet:#8a5cff; --pink:#ff4dd8;
    --glass:rgba(255,255,255,.05); --border:rgba(255,255,255,.11);
    --grad:linear-gradient(135deg,var(--cyan),var(--violet) 60%,var(--pink));
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; width:100%; overflow-x:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden;
    position:fixed; inset:0; overscroll-behavior:none;
  }

  /* ---------- animated background ---------- */
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .bg::before {
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(138,92,255,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);
  }
  .orb { position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; animation:float 18s ease-in-out infinite; }
  .orb.o1 { width:420px; height:420px; background:#0a7cff; top:-120px; left:-100px; }
  .orb.o2 { width:380px; height:380px; background:#8a5cff; bottom:-120px; right:-80px; animation-delay:-6s; }
  .orb.o3 { width:260px; height:260px; background:#ff4dd8; top:45%; left:55%; opacity:.25; animation-delay:-11s; }
  @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-30px) scale(1.12);} }

  /* ---------- layout ---------- */
  .app { position:relative; z-index:1; width:100%; height:100vh; height:var(--app-h,100dvh); max-width:880px; margin:0 auto; display:flex; flex-direction:column; }
  header {
    display:flex; align-items:center; gap:10px; margin:12px 12px 0; padding:10px 14px;
    background:var(--glass); border:1px solid var(--border); border-radius:18px;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .logo-sm { width:38px; height:38px; flex:none; filter:drop-shadow(0 0 8px rgba(0,229,255,.55)); }
  .brand { flex:1; min-width:0; }
  .brand h1 { margin:0; font-family:'Orbitron',sans-serif; font-weight:800; font-size:17px; letter-spacing:1.5px;
              background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand small { display:block; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { display:inline-block; vertical-align:middle; margin-right:6px; width:7px; height:7px; border-radius:50%; background:#2dff9a; box-shadow:0 0 8px #2dff9a; animation:pulse 2s infinite; }
  @keyframes pulse { 50%{opacity:.4;} }
  .icon-btn {
    display:flex; align-items:center; gap:6px; background:var(--glass); color:var(--text); border:1px solid var(--border);
    padding:8px 12px; border-radius:12px; font:500 13px 'Inter',sans-serif; cursor:pointer; transition:.2s; flex:none;
  }
  .icon-btn:hover { border-color:var(--cyan); box-shadow:0 0 14px rgba(0,229,255,.3); }
  .icon-btn svg { width:15px; height:15px; }

  #chat { flex:1; overflow-y:auto; padding:18px 14px 8px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }
  #chat::-webkit-scrollbar { width:6px; }
  #chat::-webkit-scrollbar-thumb { background:rgba(255,255,255,.14); border-radius:6px; }

  /* ---------- recent chats drawer ---------- */
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(2,3,10,.6); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
             opacity:0; pointer-events:none; transition:opacity .25s; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .drawer {
    position:fixed; z-index:21; top:0; bottom:0; left:0; width:min(320px,86vw); display:flex; flex-direction:column;
    padding:16px 14px calc(14px + env(safe-area-inset-bottom)); background:rgba(10,12,28,.94);
    border-right:1px solid var(--border); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    transform:translateX(-102%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .drawer.open { transform:none; box-shadow:12px 0 50px rgba(0,0,0,.5); }
  .drawer-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .drawer-head h3 { flex:1; margin:0; font-family:'Orbitron',sans-serif; font-size:14px; letter-spacing:1.5px;
                    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .close-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; border-radius:10px; display:grid; place-items:center; }
  .close-btn:hover { color:var(--text); background:var(--glass); }
  .close-btn svg { width:18px; height:18px; }
  .new-btn {
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:11px; margin-bottom:14px;
    border:none; border-radius:14px; cursor:pointer; color:#fff; font:600 14px 'Inter',sans-serif;
    background:var(--grad); box-shadow:0 4px 18px rgba(138,92,255,.4); transition:.2s;
  }
  .new-btn:hover { transform:translateY(-2px); }
  .new-btn svg { width:16px; height:16px; }
  .list-label { color:var(--muted); font-size:11.5px; letter-spacing:1px; text-transform:uppercase; margin:0 4px 8px; }
  #history { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -4px; padding:0 4px; }
  #history::-webkit-scrollbar { width:5px; }
  #history::-webkit-scrollbar-thumb { background:rgba(255,255,255,.14); border-radius:6px; }
  .h-item { display:flex; align-items:center; gap:4px; border:1px solid transparent; border-radius:12px; transition:.2s; }
  .h-item:hover { background:var(--glass); border-color:var(--border); }
  .h-item.active { background:rgba(0,229,255,.08); border-color:rgba(0,229,255,.35); }
  .h-open { flex:1; min-width:0; text-align:left; background:none; border:none; color:var(--text); cursor:pointer; padding:10px 6px 10px 12px; font:inherit; }
  .h-title { display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .h-date { display:block; margin-top:2px; font-size:11px; color:var(--muted); }
  .h-del { flex:none; background:none; border:none; color:var(--muted); cursor:pointer; padding:8px; margin-right:4px; border-radius:9px; display:grid; place-items:center; }
  .h-del:hover { color:#ff6b8a; background:rgba(255,77,110,.1); }
  .h-del svg { width:15px; height:15px; }
  .h-empty { color:var(--muted); font-size:13px; line-height:1.55; padding:10px 6px; }
  .drawer-foot { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .clear-all { width:100%; background:none; border:1px solid var(--border); color:var(--muted); padding:9px; border-radius:12px; cursor:pointer; font:500 12.5px 'Inter',sans-serif; transition:.2s; }
  .clear-all:hover { color:#ff6b8a; border-color:rgba(255,107,138,.5); }
  .privacy { margin:10px 4px 0; color:#5f6590; font-size:11px; line-height:1.5; }

  /* ---------- hero ---------- */
  .hero { margin:auto; width:100%; max-width:640px; min-width:0; text-align:center; padding:10px 6px 30px; animation:rise .7s ease both; }
  .logo-wrap { position:relative; width:128px; height:128px; margin:0 auto 18px; display:grid; place-items:center; }
  .logo-wrap .ring { position:absolute; inset:0; border-radius:50%; border:1.5px dashed rgba(0,229,255,.45); animation:spin 22s linear infinite; }
  .logo-wrap .ring.r2 { inset:-14px; border-color:rgba(138,92,255,.4); animation-duration:34s; animation-direction:reverse; }
  .logo-wrap svg { width:92px; height:92px; filter:drop-shadow(0 0 18px rgba(0,229,255,.6)); animation:breathe 4s ease-in-out infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }
  @keyframes breathe { 50%{transform:scale(1.07); filter:drop-shadow(0 0 28px rgba(138,92,255,.8));} }
  .hero h2 { margin:0; font-family:'Orbitron',sans-serif; font-weight:800; font-size:clamp(28px,7vw,42px); letter-spacing:3px;
             background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { margin:10px auto 22px; max-width:420px; color:var(--muted); line-height:1.55; font-size:14.5px; }
  .chips { width:100%; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr)); gap:10px; max-width:600px; margin:0 auto; }
  .chip {
    min-width:0; text-align:left; padding:13px 15px; color:var(--text); background:var(--glass); border:1px solid var(--border);
    border-radius:14px; font:400 13.5px/1.4 'Inter',sans-serif; cursor:pointer; transition:.25s;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .chip:hover { transform:translateY(-3px); border-color:var(--violet); box-shadow:0 8px 24px rgba(138,92,255,.28); }
  @keyframes rise { from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }

  /* ---------- messages ---------- */
  .row { display:flex; gap:10px; max-width:100%; animation:rise .35s ease both; }
  .row.user { justify-content:flex-end; }
  .avatar { width:32px; height:32px; flex:none; margin-top:2px; filter:drop-shadow(0 0 6px rgba(0,229,255,.5)); }
  .col { display:flex; flex-direction:column; min-width:0; max-width:min(88%,680px); }
  .bubble { padding:11px 15px; border-radius:18px; line-height:1.6; font-size:15px; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
  .user .bubble { background:linear-gradient(135deg,#1f6bff,#8a5cff); border-bottom-right-radius:5px; box-shadow:0 6px 22px rgba(80,90,255,.35); }
  .assistant .bubble {
    background:var(--glass); border:1px solid var(--border); border-left:2px solid var(--cyan);
    border-bottom-left-radius:5px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .bubble code { background:rgba(0,229,255,.12); color:#9ff4ff; padding:1px 6px; border-radius:6px; font-size:13.5px; }
  .bubble pre { margin:8px 0; padding:12px; background:rgba(0,0,0,.45); border:1px solid var(--border); border-radius:12px; overflow-x:auto; white-space:pre; }
  .bubble pre code { background:none; padding:0; color:#d7e3ff; }
  .actions { display:flex; gap:6px; margin:5px 0 0 4px; }
  .mini { background:none; border:none; color:var(--muted); font:500 12px 'Inter',sans-serif; display:flex; align-items:center; gap:5px; cursor:pointer; padding:3px 6px; border-radius:8px; }
  .mini:hover { color:var(--cyan); background:rgba(0,229,255,.08); }
  .mini svg { width:13px; height:13px; }
  .typing { display:flex; gap:5px; padding:6px 2px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--cyan); animation:bounce 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.15s; background:var(--violet); }
  .typing i:nth-child(3){ animation-delay:.3s; background:var(--pink); }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-6px); opacity:1;} }

  /* ---------- composer ---------- */
  .composer { padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  form {
    display:flex; align-items:flex-end; gap:8px; padding:8px 8px 8px 16px;
    background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:26px;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); transition:.25s;
  }
  form:focus-within { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,229,255,.12), 0 0 28px rgba(0,229,255,.2); }
  textarea { flex:1; resize:none; background:none; border:none; outline:none; color:var(--text); font:400 16px/1.5 'Inter',sans-serif; max-height:140px; min-width:0; padding:8px 0; }
  textarea::placeholder { color:#6c7298; }
  #send {
    width:42px; height:42px; flex:none; border:none; border-radius:50%; cursor:pointer; display:grid; place-items:center;
    background:var(--grad); color:#fff; box-shadow:0 4px 18px rgba(138,92,255,.5); transition:.2s;
  }
  #send:hover:not(:disabled) { transform:scale(1.08) rotate(-6deg); }
  #send:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
  #send svg { width:19px; height:19px; }
  .note { text-align:center; color:#5f6590; font-size:11.5px; margin-top:7px; }

  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
  @media (max-width:520px) {
    .icon-btn span { display:none; }
    .long { display:none; }
    .col { max-width:90%; }
    header { margin:8px 8px 0; padding:8px 10px; gap:8px; }
    .logo-sm { width:32px; height:32px; }
    .brand h1 { font-size:15px; letter-spacing:1px; }
    #chat { padding:14px 10px 6px; }
    .composer { padding:6px 8px calc(8px + env(safe-area-inset-bottom)); }
  }
  @media (max-height:660px) {
    .logo-wrap { width:92px; height:92px; margin-bottom:12px; }
    .logo-wrap svg { width:66px; height:66px; }
    .hero { padding-bottom:12px; }
    .hero p { margin-bottom:14px; }
  }
</style>
</head>
<body>

<!-- Logo definition (used in several places) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.6" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff4dd8"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 64 64">
      <path d="M32 4l24 14v28L32 60 8 46V18z" fill="#080a1c" stroke="url(#lg)" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M32 11l17 10v22L32 53 15 43V21z" fill="none" stroke="url(#lg)" stroke-width="1" opacity=".35"/>
      <path d="M41 24c-2-3-5-4-9-4-5 0-8 2.5-8 6 0 9 18 4 18 13 0 4-4 6-9 6-4 0-7-1.5-9-4" fill="none" stroke="url(#lg)" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="46" cy="18" r="2.2" fill="#00e5ff"/>
    </symbol>
  </defs>
</svg>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<!-- Recent chats drawer -->
<div id="overlay" class="overlay"></div>
<aside id="drawer" class="drawer" aria-label="Recent chats">
  <div class="drawer-head">
    <svg width="30" height="30" style="filter:drop-shadow(0 0 6px rgba(0,229,255,.5))"><use href="#logo"/></svg>
    <h3>RECENT CHATS</h3>
    <button id="closeDrawer" class="close-btn" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button id="newChat" class="new-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>
  <div class="list-label">Your chats</div>
  <div id="history"></div>
  <div class="drawer-foot">
    <button id="clearAll" class="clear-all" type="button">Delete all chats</button>
    <div class="privacy">Chats are saved only on this device, in this browser. Nobody else can see them.</div>
  </div>
</aside>

<div class="app">
  <header>
    <button id="menu" class="icon-btn" type="button" title="Recent chats" aria-label="Recent chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span>Recent</span>
    </button>
    <svg class="logo-sm"><use href="#logo"/></svg>
    <div class="brand">
      <h1>SESOMU AI</h1>
      <small><span class="dot"></span>Online<span class="long"> · Made by Raghvendra Sharma for Sesomu School</span></small>
    </div>
    <button id="clear" class="icon-btn" type="button" title="Start a new chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
    </button>
  </header>

  <div id="chat"></div>

  <div class="composer">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask Sesomu AI anything..." required></textarea>
      <button id="send" type="submit" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="note">Sesomu AI can make mistakes. Please check important information.</div>
  </div>
</div>

<script>
const WORKER_URL = "https://sesomu-ai.rabcd011.workers.dev";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
const historyEl = document.getElementById("history");

const SUGGESTIONS = [
  "Explain photosynthesis in simple words",
  "Help me plan a 40-minute lesson",
  "Gravity kya hota hai? Hindi mein samjhao",
  "Write a polite email to parents about a school event"
];

const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

/* ---------- saved chats (kept only in this browser) ---------- */
let chats = [];      // list of saved chats, newest first
let current = null;  // the chat being shown right now

function loadChats() {
  try { chats = JSON.parse(localStorage.getItem("sesomu_chats") || "[]"); } catch (e) { chats = []; }
  if (!Array.isArray(chats)) chats = [];
  // bring over the single chat saved by the older version of this page
  try {
    const old = JSON.parse(localStorage.getItem("sesomu_chat") || "[]");
    if (Array.isArray(old) && old.length) {
      const first = old.find((m) => m.role === "user");
      chats.unshift({ id: "old" + Date.now().toString(36), title: titleFrom(first ? first.content : "Earlier chat"), updated: Date.now() - 1000, messages: old });
    }
    localStorage.removeItem("sesomu_chat");
  } catch (e) {}
  persist();
}
function persist() {
  chats.sort((a, b) => b.updated - a.updated);
  chats = chats.slice(0, 30);
  try { localStorage.setItem("sesomu_chats", JSON.stringify(chats)); } catch (e) {}
}
function titleFrom(t) {
  t = String(t || "").replace(/\s+/g, " ").trim();
  return t.length > 42 ? t.slice(0, 42) + "…" : t || "New chat";
}
function newChat() {
  current = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "New chat", updated: Date.now(), messages: [] };
}
function removeChat(id) {
  chats = chats.filter((c) => c.id !== id);
  persist();
}

/* ---------- safe text formatting (bold, `code`, code blocks) ---------- */
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(t) {
  return t.split("```").map((p, i) => {
    if (i % 2 === 1) {
      const code = p.replace(/^[a-zA-Z0-9+#-]*\n/, "").replace(/\n$/, "");
      return "<pre><code>" + esc(code) + "</code></pre>";
    }
    return esc(p)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  }).join("");
}

function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function addUser(text) {
  const row = document.createElement("div");
  row.className = "row user";
  const col = document.createElement("div"); col.className = "col";
  const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
  col.appendChild(b); row.appendChild(col); chat.appendChild(row); scrollDown();
}

function addBot(text, typing) {
  const row = document.createElement("div");
  row.className = "row assistant";
  row.innerHTML = '<svg class="avatar"><use href="#logo"/></svg>';
  const col = document.createElement("div"); col.className = "col";
  const b = document.createElement("div"); b.className = "bubble";
  if (typing) b.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  else b.innerHTML = fmt(text);
  col.appendChild(b); row.appendChild(col); chat.appendChild(row); scrollDown();
  if (!typing) addActions(col, text);
  return { col, bubble: b };
}

function addActions(col, text) {
  const wrap = document.createElement("div"); wrap.className = "actions";
  const btn = document.createElement("button");
  btn.className = "mini"; btn.type = "button"; btn.innerHTML = ICON_COPY + " Copy";
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(text); btn.innerHTML = ICON_COPY + " Copied!"; }
    catch (e) { btn.innerHTML = ICON_COPY + " Can't copy"; }
    setTimeout(() => (btn.innerHTML = ICON_COPY + " Copy"), 1500);
  };
  wrap.appendChild(btn); col.appendChild(wrap);
}

function showHero() {
  const hero = document.createElement("div");
  hero.className = "hero"; hero.id = "hero";
  hero.innerHTML =
    '<div class="logo-wrap"><div class="ring"></div><div class="ring r2"></div><svg><use href="#logo"/></svg></div>' +
    "<h2>SESOMU AI</h2>" +
    "<p>Your smart school assistant. Ask a question, plan a lesson, or get help in English, Hindi or Hinglish.<br><small style=\"display:block;margin-top:8px;font-size:12px;color:#5f6590\">Made by Raghvendra Sharma for Sesomu School</small></p>";
  const chips = document.createElement("div"); chips.className = "chips";
  SUGGESTIONS.forEach((s) => {
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button"; c.textContent = s;
    c.onclick = () => sendMessage(s);
    chips.appendChild(c);
  });
  hero.appendChild(chips);
  chat.appendChild(hero);
}

function render() {
  chat.innerHTML = "";
  if (current.messages.length === 0) { showHero(); return; }
  current.messages.forEach((m) => (m.role === "user" ? addUser(m.content) : addBot(m.content, false)));
}

/* ---------- recent chats drawer ---------- */
function fmtDate(ts) {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return "Today, " + time;
  return d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + time;
}

function renderHistory() {
  historyEl.innerHTML = "";
  if (chats.length === 0) {
    const e = document.createElement("div");
    e.className = "h-empty";
    e.textContent = "No chats yet. Ask Sesomu AI something and your chat will appear here.";
    historyEl.appendChild(e);
    return;
  }
  chats.forEach((c) => {
    const item = document.createElement("div");
    item.className = "h-item" + (current && c.id === current.id ? " active" : "");
    const open = document.createElement("button");
    open.type = "button"; open.className = "h-open";
    const t = document.createElement("span"); t.className = "h-title"; t.textContent = c.title;
    const d = document.createElement("span"); d.className = "h-date"; d.textContent = fmtDate(c.updated);
    open.appendChild(t); open.appendChild(d);
    open.onclick = () => {
      if (sendBtn.disabled) return;
      current = c; render(); closeDrawer();
    };
    const del = document.createElement("button");
    del.type = "button"; del.className = "h-del"; del.title = "Delete this chat"; del.innerHTML = ICON_DEL;
    del.onclick = (ev) => {
      ev.stopPropagation();
      if (sendBtn.disabled) return;
      const wasCurrent = current && c.id === current.id;
      removeChat(c.id);
      if (wasCurrent) { newChat(); render(); }
      renderHistory();
    };
    item.appendChild(open); item.appendChild(del);
    historyEl.appendChild(item);
  });
}

function openDrawer() { renderHistory(); drawer.classList.add("open"); overlay.classList.add("open"); }
function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }

function startNewChat() {
  if (sendBtn.disabled) return;
  newChat(); render(); closeDrawer(); input.focus();
}

/* ---------- sending a message ---------- */
async function sendMessage(text) {
  if (sendBtn.disabled) return;
  const hero = document.getElementById("hero");
  if (hero) hero.remove();

  const thisChat = current;
  thisChat.messages.push({ role: "user", content: text });
  if (thisChat.messages.length === 1) thisChat.title = titleFrom(text);
  addUser(text);
  const bot = addBot("", true);
  let reply = "";
  sendBtn.disabled = true;

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: thisChat.messages }),
    });
    if (!res.ok) throw new Error("Server error " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const token = JSON.parse(data).response;
          if (token) {
            reply += token;
            bot.bubble.innerHTML = fmt(reply);
            scrollDown();
          }
        } catch (e) {}
      }
    }
    if (!reply) throw new Error("Empty reply");
    thisChat.messages.push({ role: "assistant", content: reply });
    thisChat.updated = Date.now();
    if (!chats.includes(thisChat)) chats.unshift(thisChat);
    persist();
    addActions(bot.col, reply);
  } catch (err) {
    bot.bubble.textContent = "Sorry, something went wrong (" + err.message + "). Please try again.";
    thisChat.messages.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ---------- input handling ---------- */
function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
input.addEventListener("input", grow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; grow();
  sendMessage(text);
});

document.getElementById("clear").addEventListener("click", startNewChat);
document.getElementById("newChat").addEventListener("click", startNewChat);
document.getElementById("menu").addEventListener("click", openDrawer);
document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
overlay.addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
document.getElementById("clearAll").addEventListener("click", () => {
  if (sendBtn.disabled || chats.length === 0) return;
  if (!confirm("Delete all saved chats on this device?")) return;
  chats = []; persist(); newChat(); render(); renderHistory();
});

/* ---------- fit the screen (phones: address bar and keyboard change the height) ---------- */
function fit() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-h", h + "px");
  window.scrollTo(0, 0);
}
fit();
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 250));
if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

/* ---------- start: always open a fresh chat ---------- */
loadChats();
newChat();
render();
</script>
