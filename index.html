<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesomu AI</title>
<style>
  :root { --bg:#0f1117; --panel:#181b24; --user:#3b5bdb; --bot:#232734; --text:#e8eaf0; --muted:#8b90a0; }
  * { box-sizing: border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding:14px 16px; background:var(--panel); display:flex; justify-content:space-between; align-items:center;
           border-bottom:1px solid #262a38; }
  header h1 { margin:0; font-size:18px; }
  header small { color:var(--muted); display:block; font-weight:normal; font-size:12px; }
  #clear { background:none; border:1px solid #333a4d; color:var(--muted); padding:6px 10px; border-radius:8px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .assistant { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  form { display:flex; gap:8px; padding:12px; background:var(--panel); border-top:1px solid #262a38; }
  textarea { flex:1; resize:none; background:var(--bot); color:var(--text); border:1px solid #333a4d; border-radius:12px;
             padding:10px 12px; font:inherit; max-height:120px; }
  textarea:focus { outline:none; border-color:var(--user); }
  button#send { background:var(--user); color:#fff; border:none; border-radius:12px; padding:0 18px; font-weight:600; cursor:pointer; }
  button#send:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Sesomu AI <small>Made by Raghvendra Sharma for Sesomu School</small></h1>
  <button id="clear" type="button">New chat</button>
</header>

<div id="chat"></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="Ask Sesomu AI anything..." required></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
// 👉 Put your Cloudflare Worker URL here after deploying
const WORKER_URL = "https://sesomu-gpt.YOUR-NAME.workers.dev";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let messages = [];
try { messages = JSON.parse(localStorage.getItem("sesomu_chat") || "[]"); } catch (e) {}

function save() {
  try { localStorage.setItem("sesomu_chat", JSON.stringify(messages.slice(-40))); } catch (e) {}
}

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function render() {
  chat.innerHTML = "";
  if (messages.length === 0) {
    addBubble("assistant", "Hi! I'm Sesomu AI, made by Raghvendra Sharma for Sesomu School. How can I help you today?");
  }
  messages.forEach((m) => addBubble(m.role, m.content));
}

async function sendMessage(text) {
  messages.push({ role: "user", content: text });
  addBubble("user", text);
  const bubble = addBubble("assistant", "…");
  let reply = "";
  sendBtn.disabled = true;

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
    });
    if (!res.ok) throw new Error("Server error " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const token = JSON.parse(data).response;
          if (token) {
            reply += token;
            bubble.textContent = reply;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch (e) {}
      }
    }
    if (!reply) throw new Error("Empty reply");
    messages.push({ role: "assistant", content: reply });
    save();
  } catch (err) {
    bubble.textContent = "Sorry, something went wrong (" + err.message + "). Please try again.";
    messages.pop(); // remove the failed user message from history
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  sendMessage(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById("clear").addEventListener("click", () => {
  messages = [];
  save();
  render();
});

render();
</script>
</body>
</html>
